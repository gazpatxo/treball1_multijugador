
<!DOCTYPE html>
<html lang="ca" color-mode="user">

<head>
    <meta charset="utf-8">
    <title>{SITE_NAME} :: Nova contrasenya</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.png">
    <link rel="stylesheet" href="mvp.css">
    <link rel="stylesheet" href="el_meu.css">
</head>

<body>
    <main>

        <header>
            <h1><a href="/">{SITE_NAME}</a></h1>
            <div>{FEEDBACK}</div>
        </header>

        <section>

            <form method="POST" action="?page=reset">

                <header>
                    <h2>Establir nova contrasenya</h2>
                </header>

                <input
                    type="hidden"
                    name="token"
                    value="{RESET_TOKEN}"
                >

                <label for="password">
                    Nova contrasenya
                </label>

                <input
                    id="password"
                    type="password"
                    name="user_password"
                    minlength="15"
                    maxlength="64"
                    required
                >

                <p>
                    Entre 15 i 64 caràcters.
                    Ha de contenir lletres i números.
                </p>

                <input
                    type="submit"
                    name="reset_password"
                    value="Canviar contrasenya"
                >

            </form>

        </section>

        <section>
            <a href="?page=login">Tornar a iniciar sessió</a>
        </section>

    </main>
</body>

</html>
