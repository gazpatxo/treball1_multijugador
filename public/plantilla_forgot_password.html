
<!DOCTYPE html>
<html lang="ca" color-mode="user">

<head>
    <meta charset="utf-8">
    <title>{SITE_NAME} :: Recuperar contrasenya</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.png">
    <link rel="stylesheet" href="mvp.css">
    <link rel="stylesheet" href="el_meu.css">
</head>

<body>
    <main>

        <header>
            <h1><a href="/">{SITE_NAME}</a></h1>
            <div>{FEEDBACK}</div>
        </header>

        <section>

            <form method="POST" action="?page=forgot">

                <header>
                    <h2>Recuperar contrasenya</h2>
                </header>

                <p>
                    Introdueix el teu nom d'usuari.
                    T'enviarem un correu electrònic
                    per establir una contrasenya nova.
                </p>

                <label for="username">
                    Nom d'usuari
                </label>

                <input
                    id="username"
                    type="text"
                    name="user_name"
                    maxlength="64"
                    required
                >

                <input
                    type="submit"
                    name="forgot_password"
                    value="Enviar correu de recuperació"
                >

            </form>

        </section>

        <section>
            <a href="?page=login">Tornar a iniciar sessió</a>
        </section>

    </main>
</body>

</html>
